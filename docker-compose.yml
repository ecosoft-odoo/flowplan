services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowplan
      POSTGRES_USER: flowplan
      POSTGRES_PASSWORD: flowplan
    volumes:
      - flowplan_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowplan -d flowplan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://flowplan:flowplan@db:5432/flowplan
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      SEED_DEMO: ${SEED_DEMO:-true}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  flowplan_data:
